id: lab-default-admin-credentials

info:
  name: ARGUS Lab - Default Admin Credentials (admin:admin)
  author: argus-lab
  severity: high
  description: |
    The /admin/ console accepts the default Basic-auth credential admin:admin.
  reference:
    - https://owasp.org/www-community/vulnerabilities/Default_credentials
  classification:
    cwe-id: CWE-1392
  tags: lab,default-login,misconfig

http:
  - raw:
      - |
        GET /admin/ HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic YWRtaW46YWRtaW4=
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "ARGUS Lab Administration"
          - "Authenticated as the default administrator account"
        condition: and
