# ARGUS intentionally vulnerable lab — Apache HTTP Server 2.4.49
#
# WARNING: This configuration is DELIBERATELY INSECURE. It exists only to give
# the ARGUS agent real, verifiable findings inside an isolated Docker network.
# Never expose this container to an untrusted network or reuse this config.
#
# Deliberate weaknesses (see KNOWN_VULNERABILITIES.md):
#   * <Directory /> Require all granted  -> enables CVE-2021-41773 traversal
#   * ScriptAlias /cgi-bin/ + ExecCGI    -> enables CVE-2021-42013 CGI RCE
#   * Verbose ServerTokens / ServerSignature
#   * server-status publicly reachable
#   * Directory listing enabled
#   * No security headers
#   * Default Basic-auth credential admin:admin

ServerRoot "/usr/local/apache2"
Listen 8080
ServerName mock-target-lab
ServerTokens Full
ServerSignature On

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule cgid_module modules/mod_cgid.so

User daemon
Group daemon

DefaultRuntimeDir /tmp
PidFile /tmp/httpd.pid
ScriptSock /tmp/cgi.sock

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

# ---------------------------------------------------------------------------
# DELIBERATE MISCONFIGURATION: broad filesystem access. This is the Apache
# 2.4.49 condition that makes CVE-2021-41773 path traversal exploitable.
# ---------------------------------------------------------------------------
<Directory />
    AllowOverride None
    Require all granted
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# The classic CVE-2021-41773 PoC traverses out of this alias. Keeping the
# alias root outside DocumentRoot is what makes the file-disclosure variant
# reach /etc/passwd instead of being rejected as "above the root path".
Alias /icons/ "/usr/local/apache2/icons/"
<Directory "/usr/local/apache2/icons">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html index.htm
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

# ---------------------------------------------------------------------------
# DELIBERATE WEAKNESS: public CGIs, including the vulnerable lab scripts.
# ---------------------------------------------------------------------------
ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>
AddHandler cgi-script .cgi .sh

# ---------------------------------------------------------------------------
# DELIBERATE WEAKNESS: Apache server-status is reachable without auth.
# ---------------------------------------------------------------------------
<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>
ExtendedStatus On

# ---------------------------------------------------------------------------
# DELIBERATE WEAKNESS: default Basic-auth credentials admin:admin.
# ---------------------------------------------------------------------------
<Location "/admin">
    AuthType Basic
    AuthName "ARGUS Lab Administration"
    AuthUserFile /usr/local/apache2/conf/lab.htpasswd
    Require valid-user
</Location>

# ---------------------------------------------------------------------------
# DELIBERATE WEAKNESS: no CSP / X-Frame-Options / HSTS headers are emitted.
# ---------------------------------------------------------------------------
