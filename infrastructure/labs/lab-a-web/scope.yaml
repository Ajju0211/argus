schema_version: "1.0"
assessment_id: "asm-lab-a-authorized"
name: "Lab A Apache 2.4.49 Evaluation Scope"
created_at: "2026-11-06T00:00:00Z"
expires_at: "2027-11-06T00:00:00Z"

targets:
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    - "192.168.100.5"
    - "mock-target-lab"
  allowed_subnets:
    - "192.168.100.0/24"
  denied_hosts:
    - "192.168.100.1"
    - "169.254.169.254"

ports:
  allowed_ports:
    - 8080
    - 8888
  denied_ports:
    - 22
    - 25

actions:
  allowed_categories:
    - "network_recon"
    - "web_crawl"
    - "passive_vuln_scan"
    - "active_template_check"
  denied_categories:
    - "denial_of_service"
    - "data_exfiltration"
    - "privilege_escalation"

network_policy:
  redirect_policy: "strict_same_host"
  allow_external_dns: false

rate_limits:
  max_requests_per_second: 10.0
  max_concurrency: 2

