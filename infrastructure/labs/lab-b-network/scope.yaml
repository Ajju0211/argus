schema_version: "1.0"
assessment_id: "asm-lab-b-authorized"
name: "Lab B Multi-Service Host Evaluation Scope"
created_at: "2026-11-06T00:00:00Z"
expires_at: "2027-11-06T00:00:00Z"

targets:
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    - "192.168.100.10"
    - "mock-target-network"
  allowed_subnets:
    - "192.168.100.0/24"
  denied_hosts:
    - "192.168.100.1"
    - "169.254.169.254"

ports:
  allowed_ports:
    - 21
    - 22
    - 8080
  denied_ports:
    - 25

actions:
  allowed_categories:
    - "network_recon"
    - "service_fingerprint"
  denied_categories:
    - "brute_force_credentials"
    - "denial_of_service"
    - "privilege_escalation"

network_policy:
  redirect_policy: "strict_same_host"
  allow_external_dns: false

rate_limits:
  max_requests_per_second: 10.0
  max_concurrency: 2

